name: sync-stats-theme

on:
  schedule:
    # every 3 hours, offset from the hour to be polite to GitHub runners
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-stats-theme
  cancel-in-progress: true

jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recolor stats cards for Beijing time
        run: python3 scripts/sync_stats_theme.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "no theme change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "style(profile): sync stats card accents to time of day [skip ci]"
          git push
